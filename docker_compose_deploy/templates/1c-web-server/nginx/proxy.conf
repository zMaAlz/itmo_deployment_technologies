# Контейнеры
upstream apache-1c {
    ip_hash;
    server apache-1c-web:80;
}
# upstream apache-1c-2 {
#     ip_hash;
#     server apache-1c:81;
# }

server {
    # Основной блок для https
    listen ${LB_HOSTNAME_PORT} ssl;
    listen [::]:${LB_HOSTNAME_PORT} ssl;
    server_name ${LB_SERVER_NAME};

    # Безопасность
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/secrets/public.crt;
    ssl_certificate_key /etc/nginx/secrets/private.key;

    client_max_body_size 2G; # Требуется для работы тонкого клиента 1С

    location / {
        proxy_pass http://apache-1c;
        proxy_connect_timeout 35s;
        proxy_send_timeout 360s; #  
        proxy_read_timeout 360s; #  
        proxy_redirect     off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}
